<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<meta name="description" content="Coupable! — le jeu de présentation des leaders du souper d'accueil du CIA (Club d'Intelligence Artificielle, Université Laval).">
<title>Coupable!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --ground:#0c0e13;
    --ink:#eef1f6;
    --alarm:#e11d33;
    --display:"Bricolage Grotesque",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  img{max-width:100%}
  [hidden]{display:none!important}

  .app{height:100dvh;position:relative;display:flex;flex-direction:column}
  /* barre du haut de l'écran des suspects : MENU blanc + titre du jeu, AU-DESSUS des cartes */
  .app-head{flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:max(13px,env(safe-area-inset-top)) clamp(12px,4vw,20px) 6px}
  .app-title{font-family:var(--display);font-weight:800;font-size:clamp(18px,5.6vw,26px);
    letter-spacing:-.02em;line-height:1;color:#fff}

  /* ---------- ACCUEIL : la ligne (100% statique, zero animation) ---------- */
  .home{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;justify-content:flex-end;
    background:
      radial-gradient(82% 62% at 50% 1%, rgba(255,255,255,.135), transparent 74%),
      #07080c;
    overflow:hidden;
  }
  .scene{position:relative;flex:0 0 auto;width:100%;display:flex;justify-content:center}
  .scene svg{width:100%;height:auto;display:block}
  /* Laptop / écran large (paysage) : sans borne, la file (ratio 248:230) déborde en hauteur et
     les têtes sont coupées. On la borne par la hauteur du viewport. Le portrait (téléphone) n'est
     jamais touché → mode normal intact. */
  @media (orientation:landscape){
    .scene svg{max-width:min(100%, calc(54dvh * 248 / 230))}
  }

  .home-copy{
    position:relative;z-index:2;flex:0 0 auto;
    padding:10px clamp(22px,7vw,46px) max(30px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:flex-start;gap:13px;
  }
  .home .title{
    font-family:var(--display);font-weight:800;letter-spacing:-.045em;line-height:.82;
    font-size:clamp(50px,17.5vw,132px);margin:0;color:#fff;
  }
  .home .title .bang{color:var(--alarm)}
  .home .tag{
    font-family:var(--mono);font-weight:600;font-size:clamp(13px,3.7vw,16px);
    letter-spacing:.01em;line-height:1.35;color:#fff;margin:0;
  }
  .start{
    margin-top:5px;border:none;border-radius:999px;padding:15px 30px;color:#0c0e13;cursor:pointer;
    font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em;
    background:#fff;
    transition:transform .09s ease;
  }
  .start:active{transform:scale(.97)}
  .start:focus-visible{outline:3px solid var(--alarm);outline-offset:3px}

  .back{
    position:absolute;z-index:5;
    top:max(13px,env(safe-area-inset-top));
    left:max(12px,env(safe-area-inset-left));
    width:42px;height:42px;padding:0;border:none;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.15);color:#fff;cursor:pointer;
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    box-shadow:0 3px 16px rgba(0,0,0,.34);
    transition:transform .09s ease, background .15s ease;
  }
  .back:hover{background:rgba(255,255,255,.26)}
  .back:active{transform:scale(.93)}
  .back:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .back svg{width:21px;height:21px;display:block}
  /* --- Retour au menu maître (app Trois jeux) — pastille BLANCHE --- */
  .to-menu{
    display:inline-flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;
    border:none;border-radius:999px;text-decoration:none;cursor:pointer;
    font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:#0c0e13;background:#fff;
    box-shadow:0 4px 16px rgba(0,0,0,.28);
    transition:transform .09s ease, filter .15s ease}
  .to-menu.tl{position:fixed;z-index:60;top:max(13px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left))}
  .to-menu:hover{filter:brightness(.96)}
  .to-menu:active{transform:scale(.93)}
  .to-menu:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .to-menu svg{width:21px;height:21px;display:block;flex:none}

  /* ---------- PICKER ---------- */
  .grid{
    flex:1;min-height:0;
    display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;
    gap:8px;padding:8px;
  }
  .tile{
    position:relative;border:none;border-radius:16px;cursor:pointer;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:16px;gap:2px;overflow:hidden;
    font-family:var(--display);
    transition:transform .09s ease;
    isolation:isolate;
  }
  .tile::before{
    content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,0) 42%,rgba(0,0,0,.14));
  }
  .tile:active{transform:scale(.97)}
  .tile:focus-visible{outline:3px solid #fff;outline-offset:-6px}
  .tile .name{font-weight:800;font-size:clamp(30px,9vw,54px);line-height:.92;letter-spacing:-.02em;white-space:nowrap}
  .tile .role{
    font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;opacity:.74;
  }

  /* ---------- FLOOD ---------- */
  .flood{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;cursor:pointer;text-align:center;padding:24px;
    animation:pop .18s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
  .flood .fname{font-family:var(--display);font-weight:800;font-size:clamp(60px,22vw,150px);line-height:.9;letter-spacing:-.03em;white-space:nowrap}
  .flood .frole{font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.74}
  .flood .change{
    position:absolute;bottom:max(22px,env(safe-area-inset-bottom));
    font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.6;
  }
  @media (prefers-reduced-motion:reduce){.flood{animation:none}.tile{transition:none}}

  /* ================= MODE PRÉSENTATION (projecteur) ================= */
  .present{position:fixed;inset:0;z-index:40;color:var(--ink);overflow:hidden;
    background:radial-gradient(82% 62% at 50% 1%, rgba(255,255,255,.135), transparent 74%), #07080c}
  .pstage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:clamp(16px,3vh,28px);
    padding:clamp(74px,11vh,116px) clamp(28px,7vw,90px) clamp(58px,9vh,88px);
    transition:background .28s ease,color .28s ease}
  .p-eyebrow{margin:0;font-family:var(--mono);font-weight:600;font-size:clamp(12px,2.4vw,15px);
    letter-spacing:.24em;text-transform:uppercase;opacity:.72}
  .p-title{margin:0;font-family:var(--display);font-weight:800;letter-spacing:-.03em;line-height:.9;
    font-size:clamp(42px,9vw,96px);text-wrap:balance;max-width:15ch}
  .p-title .bang{color:var(--alarm)}
  .p-sub{margin:0;font-family:var(--display);font-weight:600;letter-spacing:-.01em;
    font-size:clamp(19px,3.8vw,30px);line-height:1.32;max-width:26ch;opacity:.9}
  .p-fact{margin:0;font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.14;
    font-size:clamp(25px,5vw,50px);text-wrap:balance;max-width:20ch}
  .plineup{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(8px,1.4vw,14px);max-width:1040px}
  .pcard{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
    min-width:clamp(94px,15vw,152px);min-height:clamp(56px,9vh,84px);padding:10px 14px;gap:1px;border-radius:14px;
    box-shadow:0 8px 22px rgba(0,0,0,.3)}
  .pcard .pn{font-family:var(--display);font-weight:800;font-size:clamp(16px,2.6vw,24px);letter-spacing:-.02em;line-height:1;white-space:nowrap}
  .pcard .pr{font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.78}
  .pstage.flood{animation:pop .2s cubic-bezier(.2,.9,.3,1)}
  .pflood-name{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(58px,17vw,150px);line-height:.9;letter-spacing:-.03em;white-space:nowrap}
  .pflood-role{margin:0;font-family:var(--mono);font-weight:500;font-size:clamp(12px,2.4vw,15px);letter-spacing:.2em;text-transform:uppercase;opacity:.82}
  .pnav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;
    width:clamp(44px,7vw,60px);height:clamp(44px,7vw,60px);border-radius:50%;
    border:1.6px solid rgba(128,128,128,.55);background:rgba(128,128,128,.18);color:currentColor;cursor:pointer;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    font-size:clamp(24px,4vw,32px);line-height:1;display:flex;align-items:center;justify-content:center;
    transition:transform .09s ease,background .15s ease}
  .pnav:hover{background:rgba(128,128,128,.3)}
  .pnav:active{transform:translateY(-50%) scale(.92)}
  .pnav[disabled]{opacity:0;pointer-events:none}
  .pnav.prev{left:max(12px,env(safe-area-inset-left))}
  .pnav.next{right:max(12px,env(safe-area-inset-right))}
  .pbar{position:absolute;left:0;bottom:0;height:4px;width:0;background:currentColor;opacity:.85;z-index:3;transition:width .28s ease}
  @media (prefers-reduced-motion:reduce){.pstage.flood{animation:none}.pstage,.pbar{transition:none}}
</style>
</head>
<body>

<!-- ACCUEIL — la ligne -->
<section class="home" id="home">
    <a class="to-menu tl" href="../index.html" aria-label="Retour au menu"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H7"/><path d="M12.5 6.5 7 12l5.5 5.5"/></svg><span>Menu</span></a>
  <div class="scene">
    <svg viewBox="0 0 248 230" aria-hidden="true" focusable="false">
      <defs>
        <filter id="flou" x="-60%" y="-160%" width="220%" height="420%">
          <feGaussianBlur stdDeviation="3.2"/>
        </filter>
        <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".055"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="flaque">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".17"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="peau" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="196">
          <stop offset="0" stop-color="#fbfcfe"/>
          <stop offset="1" stop-color="#c6cddb"/>
        </linearGradient>
        <linearGradient id="peauR" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="196">
          <stop offset="0" stop-color="#f0304a"/>
          <stop offset="1" stop-color="#a81326"/>
        </linearGradient>
      </defs>

      <g stroke="rgba(255,255,255,.06)" stroke-width="1">
        <line x1="0" y1="48" x2="248" y2="48"/>
        <line x1="0" y1="92" x2="248" y2="92"/>
        <line x1="0" y1="136" x2="248" y2="136"/>
        <line x1="0" y1="180" x2="248" y2="180"/>
      </g>

      <rect x="0" y="196" width="248" height="34" fill="url(#sol)"/>
      <line x1="0" y1="196" x2="248" y2="196" stroke="rgba(255,255,255,.11)" stroke-width="1"/>
      <ellipse cx="124" cy="205" rx="140" ry="30" fill="url(#flaque)"/>

      <g fill="#04050a" opacity=".62" filter="url(#flou)">
        <ellipse cx="40"  cy="202" rx="21" ry="6.5"/>
        <ellipse cx="82"  cy="202" rx="21" ry="6.5"/>
        <ellipse cx="124" cy="202" rx="21" ry="6.5"/>
        <ellipse cx="166" cy="202" rx="21" ry="6.5"/>
        <ellipse cx="208" cy="202" rx="21" ry="6.5"/>
      </g>

      <g fill="url(#peau)">
        <circle cx="40" cy="59.5" r="11.5"/>
        <path d="M23 196 V90 Q23 74 39 74 H41 Q57 74 57 90 V196 Z"/>
        <circle cx="124" cy="27.5" r="11.5"/>
        <path d="M107 196 V58 Q107 42 123 42 H125 Q141 42 141 58 V196 Z"/>
        <circle cx="166" cy="67.5" r="11.5"/>
        <path d="M149 196 V98 Q149 82 165 82 H167 Q183 82 183 98 V196 Z"/>
        <circle cx="208" cy="51.5" r="11.5"/>
        <path d="M191 196 V82 Q191 66 207 66 H209 Q225 66 225 82 V196 Z"/>
      </g>
      <g fill="url(#peauR)">
        <circle cx="82" cy="37.5" r="11.5"/>
        <path d="M65 196 V68 Q65 52 81 52 H83 Q99 52 99 68 V196 Z"/>
      </g>
    </svg>
  </div>
  <div class="home-copy">
    <h1 class="title">Coupable<span class="bang">!</span></h1>
    <p class="tag">Un innocent de trop.</p>
    <button class="start" id="startBtn">Voir les suspects</button>
  </div>
</section>

<div class="app" id="app" hidden>
  <div class="app-head">
    <a class="to-menu" href="../index.html" aria-label="Retour au menu"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H7"/><path d="M12.5 6.5 7 12l5.5 5.5"/></svg><span>Menu</span></a>
    <span class="app-title">À qui le fun fact?</span>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="flood" id="flood" hidden>
  <div class="fname" id="fname"></div>
  <div class="frole" id="frole"></div>
  <div class="change">Toucher pour changer</div>
</div>

<!-- MODE PRÉSENTATION (projecteur) — série de diapos -->
<section class="present" id="present" hidden>
  <a class="to-menu tl" href="../index.html" aria-label="Retour au menu"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H7"/><path d="M12.5 6.5 7 12l5.5 5.5"/></svg><span>Menu</span></a>
  <div class="pstage" id="pstage"></div>
  <button class="pnav prev" id="pPrev" aria-label="Diapositive précédente">‹</button>
  <button class="pnav next" id="pNext" aria-label="Diapositive suivante">›</button>
  <div class="pbar" id="pbar"></div>
</section>

<script>
  /* ---- MODIFIER ICI : prénoms, rôles, couleurs ---- */
  const LEADERS = [
    { name:"Alexandrine", role:"Finances",   color:"#f4772e" }, // orange
    { name:"Cyrille",     role:"Présidence", color:"#e11d33" }, // rouge
    { name:"Nathaniel",   role:"Fondateur",  color:"#e957a8" }, // rose
    { name:"Nezar",       role:"Logistique", color:"#17306b" }, // marine
    { name:"Rana",        role:"Talents",    color:"#2fa84f" }, // vert
    { name:"Ulysse",      role:"Social",     color:"#12b6cc" }, // cyan
    { name:"Yves",        role:"Marketing",  color:"#8250c4" }, // mauve
    { name:"Zachary",     role:"Projets",    color:"#f2c018" }, // jaune
  ];

  /* ---- MODE PRÉSENTATION : ordre des fun facts = clé de l'animateur ----
     Affiché UNIQUEMENT en mode présentation (projecteur, protégé par mot de passe).
     Verbatim (ponctuation incluse); fautes de grammaire corrigées. */
  const PRESENT_ORDER = [
    { name:"Zachary",     fact:"Depuis que j'ai commencé l'électronique, j'ai réussi à faire exploser pas moins de 37 composants électroniques et à récolter au passage 5 brûlures sur les mains." },
    { name:"Cyrille",     fact:"J'ai un compte Instagram pour mon toutou, qui est un poussin dominateur. Son nom est \"letyranjaune\"." },
    { name:"Nezar",       fact:"Mon « initiation » à l'IA était de faire comme projet de Cégep une trieuse de résistances through hole." },
    { name:"Rana",        fact:"J'ai passé 7 examens pour enfin avoir mon permis de conduire (don't judge me je conduis pas si pire)." },
    { name:"Nathaniel",   fact:"Mon garde-robe est le spectre des couleurs visibles. En effet, mon garde-robe est organisé dans un dégradé de couleurs similaires. On passe du rouge à l'orange, de l'orange au jaune... Fun fact bonus : chaque cintre est de la même couleur que son chandail. On voit encore mieux le spectre grâce à eux." },
    { name:"Yves",        fact:"J'ai participé à deux hackathons dans ma vie. J'étais parmi les derniers dans l'un et j'ai eu la première place dans l'autre." },
    { name:"Ulysse",      fact:"J'ai un projet GitHub qui génère un trajet pour courir toutes les rues d'un quartier sans jamais revenir sur mes pas." },
    { name:"Alexandrine", fact:"J'ai déjà attrapé 5 chevaux sur une route secondaire (90 km/h) avec mon manteau d'hiver, une auto et un biscuit." },
  ];
  function isPresent(){ try{ return localStorage.getItem("cia-present")==="1"; }catch(e){ return false; } }
  function leaderByName(n){ return LEADERS.find(L=>L.name===n); }

  // noir ou blanc selon la luminosité de la couleur
  function inkFor(hex){
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return (0.299*r+0.587*g+0.114*b) > 150 ? "#111318" : "#ffffff";
  }

  // Reduit un prenom seulement s'il deborde vraiment (mesure exacte du texte)
  function fitToWidth(el, cible){
    el.style.fontSize="";
    if(!(cible > 0)) return;
    const range = document.createRange();
    for(let i=0; i<4; i++){                    // les metriques ne sont pas lineaires : on converge
      range.selectNodeContents(el);
      const need = range.getBoundingClientRect().width;
      if(need <= cible) break;
      el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * cible / need) + "px";
    }
  }
  // Tuile : .name est etire, sa largeur EST la place dispo
  function fitAll(){ document.querySelectorAll(".tile .name").forEach(el=>fitToWidth(el, el.clientWidth - 2)); }

  const home=document.getElementById("home");
  const grid=document.getElementById("grid");
  const app=document.getElementById("app");
  const flood=document.getElementById("flood");
  const fname=document.getElementById("fname"), frole=document.getElementById("frole");

  function fitFlood(){
    const cs = getComputedStyle(flood);
    const dispo = flood.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    fitToWidth(fname, dispo * .84);            // 16% d'air garde meme pour le plus long prenom
  }

  /* ---- PICKER : une tuile par leader ---- */
  LEADERS.forEach(L=>{
    const ink=inkFor(L.color);
    const b=document.createElement("button");
    b.className="tile";
    b.style.background=L.color;
    b.style.color=ink;
    b.innerHTML=`<span class="name">${L.name}</span><span class="role">${L.role}</span>`;
    b.addEventListener("click",()=>showFlood(L,ink));
    grid.appendChild(b);
  });

  function start(){ home.hidden=true; app.hidden=false; fitAll(); }
  document.getElementById("startBtn").addEventListener("click",()=>{ if(isPresent()) startPresent(); else start(); });

  function showFlood(L,ink){
    flood.style.background=L.color;
    flood.style.color=ink;
    fname.textContent=L.name;
    frole.textContent=L.role;
    app.hidden=true;
    flood.hidden=false;
    fitFlood();
  }
  function toPicker(){ flood.hidden=true; app.hidden=false; }
  function toHome(){ flood.hidden=true; app.hidden=true; home.hidden=false; }
  flood.addEventListener("click",toPicker);
  document.addEventListener("keydown",e=>{
    if(e.key!=="Escape") return;
    if(!flood.hidden) toPicker();
    else if(!app.hidden) toHome();
  });

  /* ================= MODE PRÉSENTATION ================= */
  const present=document.getElementById("present");
  const pstage=document.getElementById("pstage");
  const pbar=document.getElementById("pbar");
  const pPrev=document.getElementById("pPrev"), pNext=document.getElementById("pNext");
  let pslides=[], pidx=0;
  function esc(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

  function buildPresentSlides(){
    const s=[{type:"intro"}];
    PRESENT_ORDER.forEach((_,i)=>{ s.push({type:"cards",i}); s.push({type:"answer",i}); });
    return s;
  }
  function renderPresent(){
    const sl=pslides[pidx];
    pstage.classList.remove("flood");
    pstage.style.background=""; present.style.color="";
    if(sl.type==="intro"){
      pstage.innerHTML=
        `<p class="p-eyebrow">Coupable!</p>`+
        `<h2 class="p-title">À qui le fun fact<span class="bang">?</span></h2>`+
        `<p class="p-sub">À chaque tour, votez pour un leader. Mauvaise réponse? Vous êtes éliminés.</p>`;
    } else if(sl.type==="cards"){
      const cards=PRESENT_ORDER.slice(sl.i).map(f=>{
        const L=leaderByName(f.name), ink=inkFor(L.color);
        return `<div class="pcard" style="background:${L.color};color:${ink}"><span class="pn">${L.name}</span><span class="pr">${L.role}</span></div>`;
      }).join("");
      pstage.innerHTML=
        `<p class="p-eyebrow">Fun fact nº${sl.i+1} · ${PRESENT_ORDER.length-sl.i} en jeu</p>`+
        `<p class="p-fact">${esc(PRESENT_ORDER[sl.i].fact)}</p>`+
        `<div class="plineup">${cards}</div>`;
    } else { // answer — la couleur du bon suspect remplit l'écran
      const L=leaderByName(PRESENT_ORDER[sl.i].name), ink=inkFor(L.color);
      pstage.style.background=L.color; present.style.color=ink;
      pstage.classList.add("flood");
      pstage.style.animation="none"; void pstage.offsetWidth; pstage.style.animation="";
      pstage.innerHTML=
        `<p class="p-eyebrow">Fun fact nº${sl.i+1}</p>`+
        `<p class="pflood-name">${L.name}</p>`+
        `<p class="pflood-role">${L.role}</p>`;
    }
    pPrev.disabled=(pidx===0); pNext.disabled=(pidx===pslides.length-1);
    pbar.style.width=((pidx+1)/pslides.length*100)+"%";
  }
  function pgo(d){ pidx=Math.max(0,Math.min(pidx+d,pslides.length-1)); renderPresent(); }
  function startPresent(){ pslides=buildPresentSlides(); pidx=0; home.hidden=true; app.hidden=true; flood.hidden=true; present.hidden=false; renderPresent(); }
  pPrev.addEventListener("click",()=>pgo(-1));
  pNext.addEventListener("click",()=>pgo(1));
  pstage.addEventListener("click",()=>pgo(1));
  document.addEventListener("keydown",e=>{
    if(present.hidden) return;
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); pgo(1); }
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); pgo(-1); }
    else if(e.key==="Escape"){ present.hidden=true; home.hidden=false; }
  });

  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ fitAll(); if(!flood.hidden) fitFlood(); });
  addEventListener("resize",()=>{ fitAll(); if(!flood.hidden) fitFlood(); });
</script>
</body>
</html>
