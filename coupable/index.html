<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<meta name="description" content="Coupable! — le jeu de présentation des leaders du souper d'accueil du CIA (Club d'Intelligence Artificielle, Université Laval).">
<title>Coupable!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --ground:#0c0e13;
    --ink:#eef1f6;
    --alarm:#e11d33;
    --display:"Bricolage Grotesque",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  img{max-width:100%}
  [hidden]{display:none!important}

  .app{height:100dvh;position:relative}

  /* ---------- ACCUEIL : la ligne (100% statique, zero animation) ---------- */
  .home{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;justify-content:flex-end;
    background:
      radial-gradient(82% 62% at 50% 1%, rgba(255,255,255,.135), transparent 74%),
      #07080c;
    overflow:hidden;
  }
  .scene{position:relative;flex:0 0 auto;width:100%}
  .scene svg{width:100%;height:auto;display:block}

  .home-copy{
    position:relative;z-index:2;flex:0 0 auto;
    padding:10px clamp(22px,7vw,46px) max(30px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:flex-start;gap:13px;
  }
  .home .title{
    font-family:var(--display);font-weight:800;letter-spacing:-.045em;line-height:.82;
    font-size:clamp(50px,17.5vw,132px);margin:0;color:#fff;
  }
  .home .title .bang{color:var(--alarm)}
  .home .tag{
    font-family:var(--mono);font-weight:600;font-size:clamp(13px,3.7vw,16px);
    letter-spacing:.01em;line-height:1.35;color:#fff;margin:0;
  }
  .start{
    margin-top:5px;border:none;border-radius:999px;padding:15px 30px;color:#0c0e13;cursor:pointer;
    font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em;
    background:#fff;
    transition:transform .09s ease;
  }
  .start:active{transform:scale(.97)}
  .start:focus-visible{outline:3px solid var(--alarm);outline-offset:3px}

  .back{
    position:absolute;z-index:5;
    top:max(13px,env(safe-area-inset-top));
    left:max(12px,env(safe-area-inset-left));
    width:42px;height:42px;padding:0;border:none;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.15);color:#fff;cursor:pointer;
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    box-shadow:0 3px 16px rgba(0,0,0,.34);
    transition:transform .09s ease, background .15s ease;
  }
  .back:hover{background:rgba(255,255,255,.26)}
  .back:active{transform:scale(.93)}
  .back:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .back svg{width:21px;height:21px;display:block}
  /* --- Retour au menu maître (app Trois jeux) --- */
  /* Accueil : pastille « ← Menu » — lisible, un vrai corps de flèche, PAS un cercle noir */
  .to-menu{position:fixed;z-index:60;top:max(13px,env(safe-area-inset-top));
    display:inline-flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;
    border:none;border-radius:999px;text-decoration:none;cursor:pointer;
    font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:#fff;background:rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    box-shadow:0 3px 16px rgba(0,0,0,.4);
    transition:transform .09s ease, background .15s ease}
  .to-menu.tl{left:max(12px,env(safe-area-inset-left))}
  .to-menu:hover{background:rgba(255,255,255,.24)}
  .to-menu:active{transform:scale(.93)}
  .to-menu:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .to-menu svg{width:21px;height:21px;display:block;flex:none}

  /* ---------- PICKER ---------- */
  .grid{
    height:100%;
    display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;
    gap:8px;padding:8px;
  }
  .tile{
    position:relative;border:none;border-radius:16px;cursor:pointer;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:16px;gap:2px;overflow:hidden;
    font-family:var(--display);
    transition:transform .09s ease;
    isolation:isolate;
  }
  .tile::before{
    content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,0) 42%,rgba(0,0,0,.14));
  }
  .tile:active{transform:scale(.97)}
  .tile:focus-visible{outline:3px solid #fff;outline-offset:-6px}
  .tile .name{font-weight:800;font-size:clamp(30px,9vw,54px);line-height:.92;letter-spacing:-.02em;white-space:nowrap}
  .tile .role{
    font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;opacity:.74;
  }

  /* ---------- FLOOD ---------- */
  .flood{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;cursor:pointer;text-align:center;padding:24px;
    animation:pop .18s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
  .flood .fname{font-family:var(--display);font-weight:800;font-size:clamp(60px,22vw,150px);line-height:.9;letter-spacing:-.03em;white-space:nowrap}
  .flood .frole{font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.74}
  .flood .change{
    position:absolute;bottom:max(22px,env(safe-area-inset-bottom));
    font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.6;
  }
  @media (prefers-reduced-motion:reduce){.flood{animation:none}.tile{transition:none}}
</style>
</head>
<body>

<!-- ACCUEIL — la ligne -->
<section class="home" id="home">
    <a class="to-menu tl" href="../" aria-label="Retour au menu"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H7"/><path d="M12.5 6.5 7 12l5.5 5.5"/></svg><span>Menu</span></a>
  <div class="scene">
    <svg viewBox="0 0 248 230" aria-hidden="true" focusable="false">
      <defs>
        <filter id="flou" x="-60%" y="-160%" width="220%" height="420%">
          <feGaussianBlur stdDeviation="3.2"/>
        </filter>
        <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".055"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="flaque">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".17"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="peau" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="196">
          <stop offset="0" stop-color="#fbfcfe"/>
          <stop offset="1" stop-color="#c6cddb"/>
        </linearGradient>
        <linearGradient id="peauR" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="196">
          <stop offset="0" stop-color="#f0304a"/>
          <stop offset="1" stop-color="#a81326"/>
        </linearGradient>
      </defs>

      <g stroke="rgba(255,255,255,.06)" stroke-width="1">
        <line x1="0" y1="48" x2="248" y2="48"/>
        <line x1="0" y1="92" x2="248" y2="92"/>
        <line x1="0" y1="136" x2="248" y2="136"/>
        <line x1="0" y1="180" x2="248" y2="180"/>
      </g>

      <rect x="0" y="196" width="248" height="34" fill="url(#sol)"/>
      <line x1="0" y1="196" x2="248" y2="196" stroke="rgba(255,255,255,.11)" stroke-width="1"/>
      <ellipse cx="124" cy="205" rx="140" ry="30" fill="url(#flaque)"/>

      <g fill="#04050a" opacity=".62" filter="url(#flou)">
        <ellipse cx="40"  cy="202" rx="21" ry="6.5"/>
        <ellipse cx="82"  cy="202" rx="21" ry="6.5"/>
        <ellipse cx="124" cy="202" rx="21" ry="6.5"/>
        <ellipse cx="166" cy="202" rx="21" ry="6.5"/>
        <ellipse cx="208" cy="202" rx="21" ry="6.5"/>
      </g>

      <g fill="url(#peau)">
        <circle cx="40" cy="59.5" r="11.5"/>
        <path d="M23 196 V90 Q23 74 39 74 H41 Q57 74 57 90 V196 Z"/>
        <circle cx="124" cy="27.5" r="11.5"/>
        <path d="M107 196 V58 Q107 42 123 42 H125 Q141 42 141 58 V196 Z"/>
        <circle cx="166" cy="67.5" r="11.5"/>
        <path d="M149 196 V98 Q149 82 165 82 H167 Q183 82 183 98 V196 Z"/>
        <circle cx="208" cy="51.5" r="11.5"/>
        <path d="M191 196 V82 Q191 66 207 66 H209 Q225 66 225 82 V196 Z"/>
      </g>
      <g fill="url(#peauR)">
        <circle cx="82" cy="37.5" r="11.5"/>
        <path d="M65 196 V68 Q65 52 81 52 H83 Q99 52 99 68 V196 Z"/>
      </g>
    </svg>
  </div>
  <div class="home-copy">
    <h1 class="title">Coupable<span class="bang">!</span></h1>
    <p class="tag">Un innocent de trop.</p>
    <button class="start" id="startBtn">Voir les suspects</button>
  </div>
</section>

<div class="app" id="app" hidden>
  <button class="back" id="backBtn" type="button" aria-label="Retour à l'accueil">
    <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" fill="none"
         stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 12H7"/><path d="M12.5 6.5 7 12l5.5 5.5"/>
    </svg>
  </button>
  <div class="grid" id="grid"></div>
</div>

<div class="flood" id="flood" hidden>
  <div class="fname" id="fname"></div>
  <div class="frole" id="frole"></div>
  <div class="change">Toucher pour changer</div>
</div>

<script>
  /* ---- MODIFIER ICI : prénoms, rôles, couleurs ---- */
  const LEADERS = [
    { name:"Alexandrine", role:"Finances",   color:"#f4772e" }, // orange
    { name:"Cyrille",     role:"Présidence", color:"#e11d33" }, // rouge
    { name:"Nathaniel",   role:"Fondateur",  color:"#e957a8" }, // rose
    { name:"Nezar",       role:"Logistique", color:"#17306b" }, // marine
    { name:"Rana",        role:"Talents",    color:"#2fa84f" }, // vert
    { name:"Ulysse",      role:"Social",     color:"#12b6cc" }, // cyan
    { name:"Yves",        role:"Marketing",  color:"#8250c4" }, // mauve
    { name:"Zachary",     role:"Projets",    color:"#f2c018" }, // jaune
  ];

  // noir ou blanc selon la luminosité de la couleur
  function inkFor(hex){
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return (0.299*r+0.587*g+0.114*b) > 150 ? "#111318" : "#ffffff";
  }

  // Reduit un prenom seulement s'il deborde vraiment (mesure exacte du texte)
  function fitToWidth(el, cible){
    el.style.fontSize="";
    if(!(cible > 0)) return;
    const range = document.createRange();
    for(let i=0; i<4; i++){                    // les metriques ne sont pas lineaires : on converge
      range.selectNodeContents(el);
      const need = range.getBoundingClientRect().width;
      if(need <= cible) break;
      el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * cible / need) + "px";
    }
  }
  // Tuile : .name est etire, sa largeur EST la place dispo
  function fitAll(){ document.querySelectorAll(".tile .name").forEach(el=>fitToWidth(el, el.clientWidth - 2)); }

  const home=document.getElementById("home");
  const grid=document.getElementById("grid");
  const app=document.getElementById("app");
  const flood=document.getElementById("flood");
  const fname=document.getElementById("fname"), frole=document.getElementById("frole");

  function fitFlood(){
    const cs = getComputedStyle(flood);
    const dispo = flood.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    fitToWidth(fname, dispo * .84);            // 16% d'air garde meme pour le plus long prenom
  }

  /* ---- PICKER : une tuile par leader ---- */
  LEADERS.forEach(L=>{
    const ink=inkFor(L.color);
    const b=document.createElement("button");
    b.className="tile";
    b.style.background=L.color;
    b.style.color=ink;
    b.innerHTML=`<span class="name">${L.name}</span><span class="role">${L.role}</span>`;
    b.addEventListener("click",()=>showFlood(L,ink));
    grid.appendChild(b);
  });

  function start(){ home.hidden=true; app.hidden=false; fitAll(); }
  document.getElementById("startBtn").addEventListener("click",start);

  function showFlood(L,ink){
    flood.style.background=L.color;
    flood.style.color=ink;
    fname.textContent=L.name;
    frole.textContent=L.role;
    app.hidden=true;
    flood.hidden=false;
    fitFlood();
  }
  function toPicker(){ flood.hidden=true; app.hidden=false; }
  function toHome(){ flood.hidden=true; app.hidden=true; home.hidden=false; }
  document.getElementById("backBtn").addEventListener("click",toHome);
  flood.addEventListener("click",toPicker);
  document.addEventListener("keydown",e=>{
    if(e.key!=="Escape") return;
    if(!flood.hidden) toPicker();
    else if(!app.hidden) toHome();
  });

  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ fitAll(); if(!flood.hidden) fitFlood(); });
  addEventListener("resize",()=>{ fitAll(); if(!flood.hidden) fitFlood(); });
</script>
</body>
</html>
